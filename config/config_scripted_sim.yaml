subinfo_fields:
  - {name: subject_id, type: str}
subinfo_mapping: {subject_id: 参与者编号, Participant Information: 参与者信息, registration_failed: 登记失败, registration_successful: 登记成功, invalid_input: "{field} 输入无效"}
window: {size: [1280, 800], units: deg, screen: 0, bg_color: white, fullscreen: false, monitor_width_cm: 35.5, monitor_distance_cm: 57}
task:
  task_name: Mnemonic Similarity Task
  save_path: ./outputs/sim_scripted
  language: Chinese
  total_blocks: 2
  total_trials: 10
  trial_per_block: 5
  items_per_test_condition: 2
  conditions: [study_repeat, study_lure, target, lure, foil]
  key_list: [v, b, n, space]
  study_indoor_key: v
  study_outdoor_key: n
  old_key: v
  similar_key: b
  new_key: n
  seed_mode: same_across_sub
  random_seed: 78078
  delta: 0.0
  phase_order: [study_instruction, study, isi, test_instruction, test, isi, good_bye]
timing: {object_duration: 0.05, isi_duration: 0.03}
stimuli:
  study_instruction: {type: text, font: SimHei, text: "第一阶段\n\n判断物品属于室内还是室外。\nV = 室内，N = 室外。\n\n按空格键开始。", color: black, height: 0.62, wrapWidth: 24, pos: [0, 0]}
  test_instruction: {type: text, font: SimHei, text: "第二阶段\n\nV = 旧，B = 相似，N = 新。\n\n按空格键开始。", color: black, height: 0.62, wrapWidth: 24, pos: [0, 0]}
  object_image: {type: image, image: assets/objects/001a.jpg, size: [10, 10], units: deg, pos: [0, -0.4]}
  study_prompt: {type: text, font: SimHei, text: "室内还是室外？    V = 室内    N = 室外", color: black, height: 0.55, wrapWidth: 24, pos: [0, 6.0]}
  test_prompt: {type: text, font: SimHei, text: "旧、相似还是新？    V = 旧    B = 相似    N = 新", color: black, height: 0.55, wrapWidth: 25, pos: [0, 6.0]}
  blank: {type: text, font: SimHei, text: "", color: black, height: 0.5, pos: [0, 0]}
  good_bye: {type: text, font: SimHei, text: "任务完成\n\nLDI：{ldi}\nREC：{recognition}\n正确率：{accuracy}\n作答率：{response_rate}\n平均反应时：{mean_rt} 秒\n\n按空格键退出。", color: black, height: 0.58, wrapWidth: 24, pos: [0, 0]}
triggers:
  map: {experiment_start: 1, block_start: 10, study_image: 20, study_indoor_response: 21, study_outdoor_response: 22, study_timeout: 23, target: 30, lure: 31, foil: 32, old_response: 40, similar_response: 41, new_response: 42, test_timeout: 43, isi: 50, block_end: 90, experiment_end: 99}
  driver: {type: serial_url, url: "loop://"}
  policy: {strict: false}
sim:
  output_dir: outputs/sim_scripted
  participant_id: sim-scripted
  session_id: sub-sim-scripted_task-mnemonic-similarity_seed78078
  log_path: outputs/sim_scripted/sub-sim-scripted_task-mnemonic-similarity_seed78078_sim_events.jsonl
  seed: 78078
  max_wait_s: 90
  policy: warn
  responder: {type: scripted, kwargs: {key: v, rt_s: 0.01}}
